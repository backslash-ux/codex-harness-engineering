name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lint dependency
        run: python -m pip install ruff
      - name: Compile Python
        run: >-
          python -m py_compile
          plugins/codex-harness-engineering/skills/harness-engineering/scripts/*.py
          tests/*.py
          tools/*.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate distribution
        run: python tools/validate_distribution.py
      - name: Lint
        run: >-
          ruff check
          plugins/codex-harness-engineering/skills/harness-engineering/scripts
          tests
          tools
